
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhonekupi - Gaming Platform</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #090b14;
  color: white;
  font-family: Arial, sans-serif;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 7%;
  background: #111525;
  border-bottom: 1px solid #252b40;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #8b72ff;
}

nav a {
  color: white;
  text-decoration: none;
  margin-left: 20px;
}

.hero {
  text-align: center;
  padding: 90px 20px;
  background: linear-gradient(135deg, #17143b, #101b36, #090b14);
}

.hero h1 {
  font-size: 48px;
  margin-bottom: 12px;
}

.hero h1 span {
  color: #947bff;
}

.hero p {
  color: #b6b9cc;
  font-size: 17px;
}

button {
  background: #7658f5;
  color: white;
  border: none;
  padding: 14px 25px;
  border-radius: 9px;
  font-size: 16px;
  font-weight: bold;
  margin-top: 15px;
}

button:active {
  transform: scale(.97);
}

main {
  padding: 35px 7%;
}

.section-title {
  font-size: 25px;
}

.games {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 20px;
}

.game {
  background: #171c2c;
  border: 1px solid #292f46;
  border-radius: 14px;
  padding: 25px;
}

.game h3 {
  margin-top: 5px;
}

.game p {
  color: #aeb4c9;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777e96;
  border-top: 1px solid #252b40;
}
</style>
</head>

<body>

<header>
  <div class="logo">iPhonekupi</div>
  <nav>
    <a href="#home">Home</a>
    <a href="#games">Games</a>
  </nav>
</header>

<section class="hero" id="home">
  <h1>Welcome to <span>iPhonekupi</span></h1>
  <p>Your next gaming adventure starts here.</p>
  <button onclick="document.getElementById('games').scrollIntoView({behavior:'smooth'})">
    Explore Games
  </button>
</section>

<main id="games">
  <h2 class="section-title">🎮 Game Library</h2>
  <div class="games">

    <div class="game">
      <h3>Coming Soon</h3>
      <p>Our first game is being developed.</p>
    </div>

    <div class="game">
      <h3>Coming Soon</h3>
      <p>More adventures are on the way.</p>
    </div>

    <div class="game">
      <h3>Coming Soon</h3>
      <p>Discover games on iPhonekupi.</p>
    </div>

  </div>
</main>

<footer>
  © 2026 iPhonekupi. All rights reserved.
</footer>

</body>
</html>
