
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhonekupi Engine v0.1</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  overflow: hidden;
  background: #87ceeb;
  font-family: Arial, sans-serif;
}
#info {
  position: fixed;
  top: 12px;
  left: 12px;
  color: white;
  background: #101020cc;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 14px;
  z-index: 2;
}
canvas { display: block; }
</style>
</head>
<body>
<div id="info">iPhonekupi Engine v0.1<br>3D World Loading...</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 35, 100);

const camera = new THREE.PerspectiveCamera(
  70, window.innerWidth / window.innerHeight, 0.1, 150
);
camera.position.set(12, 10, 16);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  powerPreference: "low-power"
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.25));
document.body.appendChild(renderer.domElement);

// Lighting
scene.add(new THREE.HemisphereLight(0xffffff, 0x526b45, 2));

const sun = new THREE.DirectionalLight(0xffffff, 1.5);
sun.position.set(10, 20, 10);
scene.add(sun);

// Ground
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(100, 100),
  new THREE.MeshLambertMaterial({ color: 0x4b9b45 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.1;
scene.add(ground);

// Central platform
const island = new THREE.Mesh(
  new THREE.CylinderGeometry(12, 13, 2, 8),
  new THREE.MeshLambertMaterial({ color: 0x397d37 })
);
island.position.y = -1.1;
scene.add(island);

// Shared tree geometry
const trunkGeometry = new THREE.CylinderGeometry(0.25, 0.35, 2, 6);
const leavesGeometry = new THREE.ConeGeometry(1.3, 3, 6);
const trunkMaterial = new THREE.MeshLambertMaterial({ color: 0x70452a });
const leavesMaterial = new THREE.MeshLambertMaterial({ color: 0x216b32 });

function makeTree(x, z, scale = 1) {
  const tree = new THREE.Group();

  const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
  trunk.position.y = scale;
  trunk.scale.setScalar(scale);
  tree.add(trunk);

  const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
  leaves.position.y = 2.7 * scale;
  leaves.scale.setScalar(scale);
  tree.add(leaves);

  tree.position.set(x, 0, z);
  scene.add(tree);
}

// Trees around the island
[
  [-7,-5],[-5,7],[7,6],[6,-7],
  [-9,1],[9,-1],[0,9],[1,-9]
].forEach(([x,z]) => makeTree(x,z));

// Rocks
const rockGeometry = new THREE.DodecahedronGeometry(0.8, 0);
const rockMaterial = new THREE.MeshLambertMaterial({ color: 0x777777 });

[
  [-3,-3],[3,4],[5,-2],[-5,3]
].forEach(([x,z]) => {
  const rock = new THREE.Mesh(rockGeometry, rockMaterial);
  rock.position.set(x, 0.4, z);
  rock.scale.set(1.2, 0.8, 1);
  scene.add(rock);
});

// Simple rotating camera
let angle = 0;

function animate() {
  requestAnimationFrame(animate);
  angle += 0.0015;

  camera.position.x = Math.sin(angle) * 20;
  camera.position.z = Math.cos(angle) * 20;
  camera.position.y = 10;
  camera.lookAt(0, 0, 0);

  renderer.render(scene, camera);
}
animate();

// Resize support
window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

document.getElementById("info").innerHTML =
  "iPhonekupi Engine v0.1<br>3D World Running";
</script>
</body>
</html>
